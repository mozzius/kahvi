name: social-app on Android

# Builds bluesky-social/social-app's Android app with kahvi in place of Hermes
# (harness/rn/social-app-android.sh), then starts it on an emulator and keeps
# its log and a screenshot. Run by hand, or by pushing a branch named
# rn-build/*: the build takes far longer than automatic jobs are allowed.
on:
  push:
    branches: ['rn-build/**']
  workflow_dispatch:
    inputs:
      social_app_ref:
        description: social-app commit
        default: f00ec0f654fe5ecefe29164f5030e4891613b73d

env:
  CARGO_TERM_COLOR: always
  SOCIAL_APP_REF: f00ec0f654fe5ecefe29164f5030e4891613b73d

jobs:
  build:
    name: build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The runner's disk is too small for a React Native build next to
      # everything preinstalled.
      - run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-ndk --locked
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.5
      - run: harness/rn/social-app-android.sh "${{ inputs.social_app_ref || env.SOCIAL_APP_REF }}" x86_64 apk
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          KAHVI_WORK: ${{ runner.temp }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: social-app-x86_64
          path: apk/*.apk

  run:
    name: start it on an emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: social-app-x86_64
          path: apk
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: harness/rn/social-app-start.sh apk out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: social-app-run
          path: out
