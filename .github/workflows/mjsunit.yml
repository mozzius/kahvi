name: mjsunit

# V8's test/mjsunit at the commit pinned in mjsunit/v8.lock, run under the
# kahvi CLI (mjsunit/, ./mjs). Report-only for now: not a required check. It
# fails only on a regression (a test in mjsunit/expected-pass.txt that no
# longer passes).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  mjsunit:
    name: mjsunit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release -p kahvi-cli
      - run: ./mjs --engine target/release/kahvi --json mjs-results.json --markdown mjs-results.md
      - name: Update README
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('mjs-results.md') != ''
        run: |
          python3 .github/scripts/readme_section.py mjsunit mjs-results.md README.md
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "README: update mjsunit results [skip ci]" README.md
          git pull --rebase origin main
          git push origin HEAD:main
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mjs-results
          path: mjs-results.json
          if-no-files-found: ignore
