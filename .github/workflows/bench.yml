name: Bench

# Kahvi against other engines (bench/run.py). Nightly on main, but only when
# main has moved since the last benchmarked commit, and on demand;
# a run on main adds its results to the bench-results branch, whose README.md
# is the dashboard (bench/publish.py). PRs labelled `bench` run it too and get
# the table in their job summary, without publishing. The workloads are
# split over parallel jobs, each timing its engines beside the baseline, so a
# run takes a few minutes rather than forty.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Include the large Octane workloads"
        type: boolean
        default: false
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The nightly run skips itself unless something has landed on main since
  # the commit bench-results last recorded. Also deals out the shards.
  changed:
    name: anything new on main
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'bench')
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != schedule ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/contents/results?ref=bench-results" \
            --jq '[.[].name] | sort | last' 2>/dev/null || true)
          echo "last result: ${last:-none}; main is ${GITHUB_SHA::10}"
          if [[ "$last" == *"-${GITHUB_SHA::10}.json" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: .github/scripts
      - id: shards
        run: echo "shards=$(.github/scripts/bench_shards.py ${{ inputs.all && '--all' || '' }})" >> "$GITHUB_OUTPUT"

  # Each shard times some workloads on Kahvi or on the other engines, with
  # the baseline engine beside them on the same runner
  # (.github/scripts/bench_shards.py), so no job runs long.
  bench:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    name: benchmarks (${{ matrix.group }}, ${{ matrix.workloads }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changed.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - if: matrix.group == 'kahvi'
        uses: dtolnay/rust-toolchain@1.97.0
      - if: matrix.group == 'kahvi'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: matrix.group == 'kahvi'
        run: cargo build --release -p kahvi-cli -p kahvi-runtime
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: bench
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: realworld
      # Other engines. A failed install skips that engine rather than the run.
      - name: install QuickJS and Hermes
        continue-on-error: true
        run: npx -y jsvu@3.0.6 --os=linux64 --engines=quickjs,hermes
      # Boa is pinned and cached: building it takes minutes.
      - if: matrix.group == 'others'
        id: boa-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.boa
          key: boa-cli-0.22.0-${{ runner.os }}
      - name: install Boa
        if: matrix.group == 'others' && steps.boa-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: cargo install boa_cli@0.22.0 --locked --root "$HOME/.boa"
      - name: run
        env:
          ENGINES: ${{ matrix.engines }}
          WORKLOADS: ${{ matrix.workloads }}
        run: |
          export PATH="$HOME/.jsvu/bin:$HOME/.boa/bin:$PATH"
          bench/run.py --list --kahvi-dir target/release
          # shellcheck disable=SC2086 # WORKLOADS is a list of names
          bench/run.py --kahvi-dir target/release --engines "$ENGINES" --runs 3 --json shard.json $WORKLOADS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-shard-${{ matrix.id }}
          path: shard.json
          retention-days: 3

  results:
    needs: [changed, bench]
    if: always() && needs.changed.outputs.run == 'true'
    name: benchmark results
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-shard-*
          path: shards
      # Every shard must have reported: a partial table is not published.
      - name: merge
        env:
          SHARDS: ${{ needs.changed.outputs.shards }}
        run: |
          want=$(jq '.include | length' <<< "$SHARDS")
          have=$(ls shards/*/shard.json | wc -l)
          if [ "$have" != "$want" ]; then
            echo "only $have of $want benchmark shards reported" >&2
            exit 1
          fi
          bench/run.py --merge shards/*/shard.json --json bench.json --markdown bench.md
          cat bench.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench.json
      - name: publish to bench-results
        if: needs.bench.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin bench-results; then
            git worktree add results-branch origin/bench-results
            git -C results-branch checkout -B bench-results
          else
            git worktree add --detach results-branch
            git -C results-branch checkout --orphan bench-results
            git -C results-branch rm -rfq .
          fi
          bench/publish.py bench.json results-branch --sha "$GITHUB_SHA"
          git -C results-branch add -A
          git -C results-branch commit -qm "bench: results for ${GITHUB_SHA::10}"
          git -C results-branch push origin bench-results
      # The latest table also goes in the README, next to test262's.
      - name: Update README
        if: needs.bench.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          {
            echo "Benchmarks from the last run on main ($(date -u +%F), Kahvi ${GITHUB_SHA::10}, GitHub-hosted runners):"
            echo "median wall time per workload, with each engine's ratio to the baseline in brackets; lower is faster."
            echo "History and engine versions are on the [bench-results](https://github.com/${GITHUB_REPOSITORY}/tree/bench-results) branch; see [bench/](bench/README.md)."
            echo
            sed '$d' bench.md
          } > bench-readme.md
          python3 .github/scripts/readme_section.py benchmarks bench-readme.md README.md
          git diff --quiet README.md && exit 0
          git commit -m "README: update benchmark results [skip ci]" README.md
          git pull --rebase origin main
          git push origin HEAD:main
