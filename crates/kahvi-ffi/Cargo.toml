[package]
name = "kahvi-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "kahvi_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
kahvi = { path = "../kahvi" }
kahvi-core = { path = "../kahvi-core" }
mimalloc = { version = "0.1", default-features = false }

[features]
# Counts the bytes Rust code has allocated and not freed, for
# kahvi_heap_report (two relaxed atomic adds per allocation).
alloc-stats = []
